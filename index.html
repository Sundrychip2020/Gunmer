<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GUNMER レシピ検索</title><style>body{margin:0;background:#faf8f4;color:#332c27;font-family:system-ui,"Noto Sans JP",sans-serif}header{background:#e97137;color:white;padding:25px 18px}h1{margin:0;font-size:25px}main{max-width:1000px;margin:auto;padding:20px}input,select{padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;max-width:100%;box-sizing:border-box}input{width:100%}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 2px 12px #0001}.card h2{font-size:20px;margin:5px 0}.tag{display:inline-block;background:#fff0dc;border-radius:20px;padding:4px 10px;font-size:12px;margin:3px}details{margin-top:12px}summary{cursor:pointer;color:#c54e1d;font-weight:bold}li{margin:8px 0;line-height:1.6}.note{font-size:12px;color:#666}footer{text-align:center;padding:30px;color:#666}</style></head><body><header><h1>GUNMER レシピ検索</h1><p>写真から、チラシから。毎日の料理をもっと楽しく。</p></header><main><input id="q" placeholder="料理名・食材で検索" aria-label="検索"><div class="filters"><select id="cat"><option value="">すべての分類</option><option>普通の料理</option><option>介護食</option><option>制限食</option><option>薬膳料理</option></select><select id="tag"><option value="">すべてのテーマ</option><option>時短</option><option>肉料理</option><option>ご飯もの</option><option>チラシ</option></select></div><p id="count"></p><div id="list" class="grid"></div><p class="note">※写真から推定したオリジナルレシピです。栄養値は概算。介護食・制限食は個々の状態に応じた調整が必要です。</p></main><footer>GUNMER RECIPE</footer><script>const data=[{id:"001",name:"こってり鶏チャーシュー献立",cat:"普通の料理",tags:["肉料理"],time:"約35分",ingredients:["鶏もも肉300g","卵2個","小松菜100g","しょうゆ大さじ2","みりん大さじ2","酒大さじ2","砂糖大さじ1","水100ml","しょうが1かけ","にんにく1かけ","油小さじ1"],steps:["卵を7分ゆでて冷やし、小松菜もゆでる","鶏肉を皮目から焼く","調味料と水を加えて12〜15分煮る","中心まで加熱してタレを煮詰め、切って盛る"],nutrition:"約520kcal／人（概算）"},{id:"002",name:"鶏そぼろの二色丼",cat:"普通の料理",tags:["時短","ご飯もの"],time:"約10分",ingredients:["ご飯300g","鶏ひき肉200g","卵2個","小ねぎ適量","しょうゆ大さじ1と1/2","みりん大さじ1","砂糖大さじ1","酒大さじ1","おろししょうが小さじ1/2","牛乳大さじ1"],steps:["鶏肉と調味料を耐熱容器で混ぜる","600Wで3分加熱して混ぜ、さらに1〜2分十分に加熱する","卵と牛乳を混ぜ600Wで40秒、混ぜて20秒ずつ追加加熱する","ご飯に両方のそぼろと小ねぎを盛る"],nutrition:"約550kcal／人（概算）"},{id:"003",name:"豚肉と玉ねぎの甘辛炒め",cat:"普通の料理",tags:["時短","肉料理"],time:"約10分",ingredients:["豚こま肉250g","玉ねぎ1個","油小さじ1","しょうゆ大さじ1と1/2","みりん大さじ1","酒大さじ1","砂糖小さじ2","おろししょうが小さじ1","葉物適量"],steps:["玉ねぎを薄切りにする","調味料を混ぜる","豚肉を中火で2〜3分炒める","玉ねぎを加え3〜4分炒める","タレを加えて肉の中心まで十分に加熱し、煮絡める"],nutrition:"約410kcal／人（概算）"}];function render(){let q=document.querySelector("#q").value.trim().toLowerCase(),c=document.querySelector("#cat").value,t=document.querySelector("#tag").value;let a=data.filter(x=>(!c||x.cat===c)&&(!t||x.tags.includes(t))&&(!q||[x.name,...x.ingredients,...x.tags].join(" ").toLowerCase().includes(q)));document.querySelector("#count").textContent=a.length+"件のレシピ";document.querySelector("#list").innerHTML=a.map(x=>'<article class="card"><small>RECIPE '+x.id+'</small><h2>'+x.name+'</h2><div>'+[x.cat,...x.tags].map(z=>'<span class="tag">'+z+'</span>').join("")+'</div><p>2人分 ・ '+x.time+'</p><details><summary>材料を見る</summary><ul>'+x.ingredients.map(z=>'<li>'+z+'</li>').join("")+'</ul></details><details><summary>作り方を見る</summary><ol>'+x.steps.map(z=>'<li>'+z+'</li>').join("")+'</ol></details><details><summary>栄養成分を見る</summary><p>'+x.nutrition+'</p></details></article>').join("")}document.querySelectorAll("input,select").forEach(x=>x.addEventListener("input",render));render();</script></body></html>
